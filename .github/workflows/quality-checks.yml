name: Math Quest Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # These checks use Node built-ins. Native dependencies belong to their packaging jobs.
      - name: Verify game logic and academic readiness
        run: npm test
      - name: Verify registered K–12 curriculum inventory
        run: node scripts/audit-k12-pathway.cjs | cmp - K12_CURRICULUM_MAP.json
      - name: Build web and Android assets
        run: npm run build
      - name: Check generated application assets
        run: |
          test -s www/index.html
          test -s www/js/college-curriculum.js
          test -s www/js/readiness-lab.js
          test -s www/css/hub.css
          test -s www/js/character3d.js
          test -s www/js/college-procedural.js
          cmp js/college-curriculum.js www/js/college-curriculum.js
          cmp js/readiness-lab.js www/js/readiness-lab.js
          cmp js/character3d.js www/js/character3d.js
          cmp css/hub.css www/css/hub.css
          grep -q 'id="hub-continue"' www/index.html
          cmp js/college-procedural.js www/js/college-procedural.js
          cmp js/pet-manager.js www/js/pet-manager.js
          cmp js/save-manager.js www/js/save-manager.js
          grep -q 'Pet care continues while the game is closed' www/index.html
